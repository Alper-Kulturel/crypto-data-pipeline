services:
  postgres:
    image: postgres:16
    container_name: quant-pg
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quantdev
      POSTGRES_DB: marketdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: